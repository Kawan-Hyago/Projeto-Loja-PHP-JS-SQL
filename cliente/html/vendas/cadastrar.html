<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda</title>
    <link rel="stylesheet" href="../../css/estilo.css">
</head>
<body>
    <nav><a href="../../index.html">Início</a> <a href="listar.html">Vendas</a></nav>
    <h1 id="titulo">Cadastrar venda</h1>
    <p id="mensagem" class="mensagem" hidden></p>
    <form id="formulario">
        <label>Cliente
            <select id="cliente" required>
                <option value="">Selecione um cliente</option>
            </select>
        </label>
        <label>Data da venda
            <input type="date" id="data" required>
        </label>
        <fieldset>
            <legend>Produtos</legend>
            <div id="listaProdutos"></div>
        </fieldset>
        <p class="total">Total: <span id="total">R$ 0,00</span></p>
        <button type="submit">Salvar</button>
        <a class="botao" href="listar.html">Cancelar</a>
    </form>
    <script src="../../js/api.js"></script>
    <script src="../../js/vendas/cadastrar.js"></script>
</body>
</html>
